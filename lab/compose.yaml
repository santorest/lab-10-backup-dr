# Lab 10: two primaries with synthetic writers, two clean restore targets and an Object Lock bucket on MinIO.
# Software pinned by digest (MinIO and mc are Chainguard builds; MinIO no longer publishes community images).
# out/ (git-ignored) holds the local backup tier and the restore inputs.
name: lab10
x-mssql: &mssql
  image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
  environment: {ACCEPT_EULA: "Y", MSSQL_PID: Developer, MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?run scripts/make-secrets.sh}"}
  healthcheck:
    test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' -b"]
    interval: 5s
    retries: 60
x-pg: &pg
  image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
services:
  mssql-primary:
    <<: *mssql
    volumes: [../out/backup-local:/backup, ./mssql:/lab:ro]
  mssql-restore:
    <<: *mssql
    volumes: [../out/restore/mssql:/restore:ro, ./mssql:/lab:ro]
  pg-primary:
    <<: *pg
    environment: {POSTGRES_PASSWORD: "${PG_PASSWORD:?}", POSTGRES_DB: billing}
    command: [postgres, -c, archive_mode=on, -c, "archive_command=/lab/archive-wal.sh %p %f", -c, "archive_timeout=${PG_ARCHIVE_TIMEOUT:-1}"]
    volumes: [../out/backup-local:/backup, ./pg:/lab:ro]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres", "-d", "billing"], interval: 3s, retries: 60}
  pg-restore:
    <<: *pg
    entrypoint: [sleep, infinity]   # filled by the restore, then started with pg_ctl
    user: postgres
    volumes: [../out/restore/pg:/restore:ro, ./pg:/lab:ro]
  minio:
    image: chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    command: [server, /data]
    environment: {MINIO_ROOT_USER: drill-admin, MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"}
    ports: ["127.0.0.1:9000:9000"]
  mc:
    image: chainguard/minio-client@sha256:231c5976b6145971a5440dcd99257b23840513999f87cbcb68cd6a8ba674ca51
    profiles: [tools]
    environment: {MC_HOST_admin: "http://drill-admin:${MINIO_ROOT_PASSWORD}@minio:9000"}
    volumes: [../policy/minio-writer-policy.json:/policy/writer.json:ro]
