    SQL Server y PostgreSQL se respaldan en un recurso local y en un bucket con Object Lock; un ransomware simulado
    destruye las bases y el recurso y ataca el bucket; ambas se restauran solo desde la copia inmutable y el RPO/RTO
    se mide frente a objetivos en CI.
