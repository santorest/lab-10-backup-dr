name: spike
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets for this run
        run: bash scripts/make-secrets.sh
      - name: Spike
        run: bash spike/spike.sh
      - name: Logs
        if: always()
        run: |
          docker compose -f spike/compose.yaml ps -a
          docker compose -f spike/compose.yaml logs --tail 60
